name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - dev

jobs:
  fix_code:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/code.yaml
    permissions:
      contents: write
    secrets: inherit

  lint:
    needs: fix_code
    if: >-
      always() &&
      needs.fix_code.result != 'failure' &&
      needs.fix_code.outputs.changed != 'true'
    uses: ./.github/workflows/lint.yaml

  test:
    needs: fix_code
    if: >-
      always() &&
      needs.fix_code.result != 'failure' &&
      needs.fix_code.outputs.changed != 'true'
    uses: ./.github/workflows/test.yaml
