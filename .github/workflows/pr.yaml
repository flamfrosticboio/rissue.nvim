name: PR

on:
  pull_request_target:
    types: [opened, edited, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  auto-label:
    runs-on: ubuntu-slim
    steps:
      - name: Label PR by title prefix
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title.toLowerCase();

            const rules = [
              { regex: /^(bugfix|fix)(\(.+\))?!?:/, label: 'bugfix' },
              { regex: /^feat(\(.+\))?!?:/,         label: 'feature' },
              { regex: /^docs(\(.+\))?!?:/,         label: 'docs' },
              { regex: /^(chore|merge)(\(.+\))?!?:/, label: 'chore' },
            ];

            const managed = rules.map(r => r.label);
            const match = rules.find(r => r.regex.test(title));

            // Remove stale managed labels (e.g. after a title edit)
            const current = context.payload.pull_request.labels.map(l => l.name);
            for (const name of current) {
              if (managed.includes(name) && (!match || match.label !== name)) {
                await github.rest.issues.removeLabel({
                  ...context.repo,
                  issue_number: context.issue.number,
                  name,
                });
              }
            }

            if (match) {
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: context.issue.number,
                labels: [match.label],
              });
            }
