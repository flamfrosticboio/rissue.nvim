default_install_hook_types:
  - pre-commit
  - commit-msg
  - pre-push
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: insert-license
        files: \.lua$
        args:
          - --license-filepath
          - LICENSE_HEADER.txt
          - --comment-style=--
        exclude: ^types/
      - id: remove-tabs
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - --verbose
  - repo: local
    hooks:
      - id: format
        name: Format lua files
        entry: mise format --
        language: system
        types: [lua]
        pass_filenames: true
      - id: autodoc
        name: Generate Documentation
        entry: mise doc
        language: system
        types: [lua]
        files: ^lua/
      - id: lint
        name: Lint lua files
        entry: mise lint --
        language: system
        types: [lua]
        exclude: ^test/
        pass_filenames: true
      - id: lint-tests
        name: Lint lua test files
        entry: mise lint_test --
        language: system
        types: [lua]
        files: ^test/
        pass_filenames: true
      - id: test
        name: Tests
        entry: mise test
        language: system
        types: [lua]
        exclude: ^lua/rissue/types/
        pass_filenames: false
        stages: [pre-commit, pre-push]
